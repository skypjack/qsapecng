  <g style="fill:none;stroke:#000000;stroke-width:1.5;stroke-linejoin:miter">
    <path d="M 2,8 H 12" />
    <rect x="12" y="4.5" width="24" height="7" />
    <path d="M 36,8 H 46" />
  </g>
  <circle cx="2" cy="8" r="1" style="fill:#000000" />
  <circle cx="46" cy="8" r="1" style="fill:#000000" />
